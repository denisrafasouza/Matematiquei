<!DOCTYPE html>

<head>

<title>Aprenda Funções</title>
<style>
:root{--navy:#0b2a5b;--blue:#2f8cff;--sky:#e8f3ff;--bg:#f5f9ff;--ink:#1b2a41;--mut:#5b6b86;--line:#dbe8fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.hero{background:linear-gradient(135deg,var(--navy),#17489a);color:#fff;border-radius:20px;padding:30px 26px;margin-bottom:18px}

var app=document.getElementById("app"),menu=document.getElementById("menu"),ddb=document.getElementById("ddb");
var nf=function(v){return String(+v.toPrecision(6)).replace(".",",").replace("-","−")};
var li=function(a){return a.map(function(t){return "<li>"+t+"</li>"}).join("")};

/* ---------- Interpretação segura de expressões ---------- */
function parse(raw){
  var s=String(raw).trim();
  if(!s)throw new Error("Digite uma função, por exemplo: f(x) = 2x + 3.");
  s=s.replace(/^(f\s*\(\s*x\s*\)|y)\s*=/i,"").replace(/[−–]/g,"-").replace(/[·×]/g,"*").replace(/÷/g,"/").replace(/,/g,".").replace(/²/g,"^2").replace(/³/g,"^3").replace(/\bsen\b/gi,"sin").replace(/π/g,"pi").replace(/√/g,"sqrt");
  if(s.indexOf("=")>=0)throw new Error("Use apenas um sinal de igual, no começo: f(x) = ...");
  var o="",open=false;
  for(var i=0;i<s.length;i++){var c=s[i];if(c==="|"){o+=open?")":"abs(";open=!open}else o+=c}
  if(open)throw new Error("O módulo ficou aberto: falta fechar a barra |.");
  s=o;
  var bal=0;for(i=0;i<s.length;i++){if(s[i]==="(")bal++;if(s[i]===")")bal--;if(bal<0)break}
  if(bal!==0)throw new Error("Parênteses desbalanceados: confira se cada ( tem o seu ).");
  var node;
  try{node=math.parse(s)}catch(e){throw new Error("Não consegui interpretar a expressão. Confira operadores (+ − * / ^), parênteses e se não falta algum número.")}
  var sc={x:0,log:Math.log10,ln:Math.log,sqrt:Math.sqrt,pi:Math.PI,e:Math.E};
  node.traverse(function(n,p,par){
    var t=n.type;
    if(t==="FunctionNode"){
      var nm=n.fn&&n.fn.name||"";
      if(!/^(abs|sqrt|ln|log\d*|sin|cos|tan|asin|acos|atan|exp)$/.test(nm))throw new Error("A função “"+nm+"” não é permitida. Use abs, log, logN (como log2) ou ln.");
      var m=nm.match(/^log(\d+)$/);
      if(m){var b=+m[1];if(b<2)throw new Error("Base inválida: a base do logaritmo deve ser positiva e diferente de 1.");sc[nm]=function(v){return Math.log(v)/Math.log(b)}}
    }else if(t==="SymbolNode"){
      if(par&&par.type==="FunctionNode"&&p==="fn")return;
      if(["x","pi","e"].indexOf(n.name)<0)throw new Error("O símbolo “"+n.name+"” não é reconhecido. Use apenas a variável x. Para multiplicar, use * ou escreva 2x.");
    }else if(t==="OperatorNode"){
      if(["+","-","*","/","^"].indexOf(n.op)<0)throw new Error("O operador “"+n.op+"” não é permitido. Use + − * / ^.");
    }else if(t==="ConstantNode"){
      if(typeof n.value!=="number")throw new Error("Use apenas números, a variável x e operadores.");
    }else if(t!=="ParenthesisNode")throw new Error("Expressão não permitida. Use apenas números, x, operadores e as funções abs, log, ln e sqrt.");
  });
  var code=node.compile();
  var f=function(x){sc.x=x;try{var r=code.evaluate(sc);return typeof r==="number"?r:NaN}catch(e){return NaN}};
  return {f:f,node:node};
}
function hasX(n){return n.filter(function(m){return m.type==="SymbolNode"&&m.name==="x"}).length>0}
var P=[-3,-2,-1,0,1,2,3,4,.5,-2.5,3.7];
function close(a,b){return Math.abs(a-b)<=1e-7*(1+Math.abs(a)+Math.abs(b))}
function check(cat,f,node){
  var a,b,c,r,d;
  if(cat==="logaritmica"){
    var lg=node.filter(function(n){return n.type==="FunctionNode"&&/^(ln|log\d*)$/.test(n.fn.name)&&hasX(n)});
    if(!lg.length)throw new Error("Esta expressão não é logarítmica. Use log(x), log2(x) ou outra base, como log3(x).");
    if(![.5,1,2,4,10].some(function(x){return isFinite(f(x))}))throw new Error("A função não está definida para valores positivos de x. Confira a expressão.");
    return "Domínio e imagem: o gráfico só aparece onde o logaritmando é positivo. Pontos fora do domínio não são desenhados.";
  }
  if(!P.every(function(x){return isFinite(f(x))}))throw new Error("Nesta categoria a função deve estar definida para todo x real. Confira divisões por zero e raízes ou logaritmos de números negativos.");
  if(cat==="constante"){
    if(!P.every(function(x){return close(f(x),f(0))}))throw new Error("Não é função constante: o valor de f(x) muda quando x muda. Exemplos válidos: 5 ou -3.");
    return "f(x) = "+nf(f(0))+"<br>Domínio: ℝ · Imagem: {"+nf(f(0))+"}";
  }
  if(cat==="afim"||cat==="linear"){
    a=f(1)-f(0);b=f(0);
    if(!P.every(function(x){return close(f(x),a*x+b)}))throw new Error("Não é função "+(cat==="afim"?"afim":"linear")+": precisa ter a forma "+(cat==="afim"?"ax + b":"ax")+", sem x², módulos nem potências de x.");
    if(close(a,0))throw new Error("Com a = 0 a função é constante. Veja a página de Função Constante.");
    if(cat==="linear"&&!close(b,0))throw new Error("Função linear não tem termo independente: deve ter a forma ax e passar pela origem. Esta expressão é afim.");
    return "a = "+nf(a)+" ("+(a>0?"crescente":"decrescente")+"), b = "+nf(b)+"<br>Raiz: x = "+nf(-b/a)+" · Corta o eixo y em (0, "+nf(b)+")"+(cat==="afim"&&close(b,0)?"<br>Como b = 0, ela também é linear.":"")+"<br>Domínio: ℝ · Imagem: ℝ";
  }
  if(cat==="quadratica"){
    c=f(0);a=(f(1)+f(-1))/2-c;b=(f(1)-f(-1))/2;
    if(!P.every(function(x){return close(f(x),a*x*x+b*x+c)}))throw new Error("Não é função quadrática: precisa ter a forma ax² + bx + c, com x elevado ao quadrado como maior potência.");
    if(close(a,0))throw new Error("O coeficiente de x² é zero, então a função não é quadrática. Ela é afim ou constante.");
    d=b*b-4*a*c;var xv=-b/(2*a),yv=f(xv);
    var rz=d>0?"x = "+nf((-b-Math.sqrt(d))/(2*a))+" e x = "+nf((-b+Math.sqrt(d))/(2*a)):d===0||close(d,0)?"x = "+nf(xv):"nenhuma raiz real";
    return "a = "+nf(a)+", b = "+nf(b)+", c = "+nf(c)+" · Δ = "+nf(d)+"<br>Raízes: "+rz+"<br>Vértice: ("+nf(xv)+", "+nf(yv)+") · Concavidade para "+(a>0?"cima":"baixo")+"<br>Domínio: ℝ · Imagem: y "+(a>0?"≥ ":"≤ ")+nf(yv);
  }
  if(cat==="modular"){
    var ab=node.filter(function(n){return n.type==="FunctionNode"&&n.fn.name==="abs"&&hasX(n)});
    if(!ab.length)throw new Error("Função modular precisa ter o módulo de uma expressão com x, como |x| ou |x - 2| + 3.");
    return "Domínio: ℝ<br>O vértice do V fica no ponto de menor (ou maior) valor do gráfico.";
  }
  if(cat==="exponencial"){
    var f0=f(0);r=f(1)/f0;
    var bad=close(f0,0)||!isFinite(r)||!P.every(function(x){return close(f(x+1),r*f(x))});
    if(bad||!(r>0))throw new Error("Não é função exponencial: precisa ter x no expoente, como 2^x ou 3^x, com base positiva e diferente de 1.");
    if(close(r,1))throw new Error("Com base 1 a função vira constante. A base deve ser positiva e diferente de 1.");
    return "Valor inicial a = "+nf(f0)+" · Base b = "+nf(r)+" ("+(r>1?"crescente":"decrescente")+")<br>Assíntota horizontal: y = 0<br>Domínio: ℝ · Imagem: "+(f0>0?"(0, +∞)":"(−∞, 0)");
  }
}

/* ---------- Plano cartesiano interativo ---------- */
function Plot(cv,tip){
  var self=this;this.cv=cv;this.tip=tip;this.g=cv.getContext("2d");this.f=null;this.m=null;this.d=null;this.reset();
  new ResizeObserver(function(){self.size()}).observe(cv);
  cv.addEventListener("pointerdown",function(e){self.d={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
  cv.addEventListener("pointermove",function(e){
    if(self.d){self.cx-=(e.clientX-self.d.x)/self.s;self.cy+=(e.clientY-self.d.y)/self.s;self.d={x:e.clientX,y:e.clientY};self.m=null}
    else self.m=self.pos(e);
    self.draw()});
  var end=function(){self.d=null;cv.style.cursor="grab"};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",function(){self.m=null;self.draw()});
  cv.addEventListener("wheel",function(e){e.preventDefault();self.zoom(e.deltaY<0?1.15:1/1.15,self.pos(e))},{passive:false});
}
Plot.prototype.reset=function(){this.cx=0;this.cy=0;this.s=40;if(this.W)this.draw()};
Plot.prototype.pos=function(e){var r=this.cv.getBoundingClientRect();return {px:e.clientX-r.left,py:e.clientY-r.top}};
Plot.prototype.zoom=function(k,p){
  p=p||{px:this.W/2,py:this.H/2};
  var wx=this.cx+(p.px-this.W/2)/this.s,wy=this.cy-(p.py-this.H/2)/this.s;
  this.s=Math.min(20000,Math.max(2,this.s*k));
  this.cx=wx-(p.px-this.W/2)/this.s;this.cy=wy+(p.py-this.H/2)/this.s;this.draw();
};
Plot.prototype.size=function(){
  var d=window.devicePixelRatio||1,r=this.cv.getBoundingClientRect();
  this.W=r.width;this.H=r.height;this.cv.width=r.width*d;this.cv.height=r.height*d;
  this.g.setTransform(d,0,0,d,0,0);this.draw();
};
Plot.prototype.draw=function(){
  var g=this.g,W=this.W,H=this.H,s=this.s,cx=this.cx,cy=this.cy;if(!W)return;
  g.clearRect(0,0,W,H);g.fillStyle="#fff";g.fillRect(0,0,W,H);
  var X=function(x){return W/2+(x-cx)*s},Y=function(y){return H/2-(y-cy)*s};
  var x0=cx-W/2/s,x1=cx+W/2/s,y0=cy-H/2/s,y1=cy+H/2/s;
  var t=90/s,p=Math.pow(10,Math.floor(Math.log10(t))),mm=t/p,st=(mm<=1?1:mm<=2?2:mm<=5?5:10)*p,i,v;
  g.font="12px system-ui,sans-serif";g.lineWidth=1;g.strokeStyle="#e3ecf8";g.fillStyle="#5b6b86";
  var ya=Math.min(Math.max(Y(0),14),H-8),xa=Math.min(Math.max(X(0),30),W-6);
  g.beginPath();
  for(i=Math.ceil(x0/st);i<=Math.floor(x1/st);i++){v=i*st;g.moveTo(Math.round(X(v))+.5,0);g.lineTo(Math.round(X(v))+.5,H)}
  for(i=Math.ceil(y0/st);i<=Math.floor(y1/st);i++){v=i*st;g.moveTo(0,Math.round(Y(v))+.5);g.lineTo(W,Math.round(Y(v))+.5)}
  g.stroke();
  g.textAlign="center";
  for(i=Math.ceil(x0/st);i<=Math.floor(x1/st);i++){if(i)g.fillText(nf(i*st),X(i*st),ya+(ya>=H-8?-6:14))}
  g.textAlign="right";
  for(i=Math.ceil(y0/st);i<=Math.floor(y1/st);i++){if(i)g.fillText(nf(i*st),xa-5,Y(i*st)+4)}
  g.strokeStyle="#0b2a5b";g.lineWidth=1.6;g.beginPath();
  g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();
  g.fillStyle="#0b2a5b";g.font="bold 14px system-ui,sans-serif";g.textAlign="left";
  g.fillText("x",W-14,Math.min(Math.max(Y(0)-8,14),H-6));g.fillText("y",Math.min(Math.max(X(0)+8,6),W-14),14);
  g.font="12px system-ui,sans-serif";g.fillStyle="#5b6b86";g.textAlign="right";g.fillText("0",xa-5,ya+(ya>=H-8?-6:14));
  var f=this.f;
  if(f){
    g.beginPath();g.strokeStyle="#1f7ae0";g.lineWidth=2.6;g.lineJoin="round";var pv=null;
    for(var px=0;px<=W;px++){
      var y=f(x0+px/s),py=Y(y);
      if(!isFinite(y)||Math.abs(py)>1e6){pv=null;continue}
      if(pv===null||Math.abs(py-pv)>H*3)g.moveTo(px,py);else g.lineTo(px,py);
      pv=py;
    }
    g.stroke();
  }
  var tip=this.tip,m=this.m;
  if(m){
    var mx=x0+m.px/s,txt;
    if(f){
      var my=f(mx);
      if(isFinite(my)){
        g.fillStyle="#fff";g.strokeStyle="#0b2a5b";g.lineWidth=2.5;g.beginPath();g.arc(m.px,Y(my),5,0,7);g.fill();g.stroke();
        txt="x = "+nf(mx)+"   f(x) = "+nf(my);
      }else txt="x = "+nf(mx)+"   f(x) indefinida";
    }else txt="x = "+nf(mx)+"   y = "+nf(y1-m.py/s);
    tip.textContent=txt;tip.style.display="block";
    tip.style.left=Math.min(m.px+14,W-tip.offsetWidth-6)+"px";tip.style.top=Math.max(m.py-34,4)+"px";
  }else tip.style.display="none";
};

const T={
limites:[["O que é limite?","O limite descreve o valor do qual f(x) se aproxima quando x se aproxima de a, sem precisar chegar nele: <b>lim<sub>x→a</sub> f(x) = L</b>. Ex.: f(x) = (x²−1)/(x−1) não existe em x = 1, mas para x = 0,9; 0,99; 0,999 dá 1,9; 1,99; 1,999. Logo, o limite é 2. Aplicação: velocidade instantânea."],
["Definição matemática","lim f(x) = L significa: para todo ε &gt; 0 existe δ &gt; 0 tal que 0 &lt; |x−a| &lt; δ implica |f(x)−L| &lt; ε. ε é a tolerância em y e δ é a distância em x. Ex.: f(x) = 2x+1, a = 3, L = 7: |2x+1−7| = 2|x−3|, então basta δ = ε/2."],
["Limites laterais","lim<sub>x→a⁻</sub> aproxima-se pela esquerda e lim<sub>x→a⁺</sub> pela direita. O limite existe somente se os dois forem iguais. Ex.: f(x) = |x|/x vale −1 à esquerda de 0 e +1 à direita, então o limite em 0 não existe."],
["Propriedades","Se lim f = L e lim g = M: lim(f±g) = L±M; lim(f·g) = L·M; lim(f/g) = L/M (M ≠ 0); lim(c·f) = c·L; lim fⁿ = Lⁿ. Ex.: lim<sub>x→2</sub> (x²+3x) = 4+6 = 10."],
["Limites infinitos","lim f = +∞ quando f cresce sem parar perto de a (assíntota vertical). Ex.: lim<sub>x→0⁺</sub> 1/x = +∞ e lim<sub>x→0⁻</sub> 1/x = −∞. Também lim<sub>x→∞</sub> 1/x = 0 (assíntota horizontal)."],
["Limites fundamentais","lim<sub>x→0</sub> sen(x)/x = 1; lim<sub>x→∞</sub> (1+1/x)ˣ = e; lim<sub>x→0</sub> (eˣ−1)/x = 1; lim<sub>x→0</sub> (1−cos x)/x = 0. Ex.: lim sen(3x)/x = 3, multiplicando e dividindo por 3."],
["Continuidade","f é contínua em a se f(a) existe, o limite em a existe e lim f(x) = f(a). Ex.: f(x) = x²+1 é contínua em ℝ: em x = 2, f(2) = 5 e o limite também é 5."],
["Descontinuidade","<b>Removível</b>: o limite existe, mas é diferente de f(a) ou f(a) não existe, como (x²−1)/(x−1) em x = 1. <b>De salto</b>: laterais finitos e diferentes, como |x|/x em 0. <b>Infinita</b>: f tende a ±∞, como 1/x em 0."],
["Teorema do Confronto","Se g(x) ≤ f(x) ≤ h(x) perto de a e lim g = lim h = L, então lim f = L. Ex.: −|x| ≤ x·sen(1/x) ≤ |x| e ±|x| → 0, então lim<sub>x→0</sub> x·sen(1/x) = 0."],
["Quando o limite não existe","<b>1)</b> Laterais diferentes: |x|/x em 0. <b>2)</b> Cresce sem limite: 1/x² em 0 tende a +∞ (não é um número). <b>3)</b> Oscilação: sen(1/x) em 0 oscila entre −1 e 1. <b>4)</b> Sem aproximação: f não definida perto de a. Clique nos exemplos da calculadora para ver cada caso no gráfico."]],
derivadas:[["O que é derivada?","A derivada mede a taxa de variação instantânea de f; geometricamente, é a inclinação da reta tangente ao gráfico. Ex.: se s(t) = t² metros, a velocidade é s′(t) = 2t. Em t = 3 s, é 6 m/s."],
["Definição de derivada","<b>f′(x) = lim<sub>h→0</sub> [f(x+h) − f(x)] / h</b>. O quociente é a inclinação da reta secante; quando h → 0, ela se torna a tangente. Ex.: f(x) = x²: [(x+h)²−x²]/h = 2x+h, que tende a 2x."],
["Regras básicas","(c)′ = 0; (xⁿ)′ = n·xⁿ⁻¹; (f±g)′ = f′±g′; (c·f)′ = c·f′. Ex.: f(x) = 3x²+2x−5 resulta em f′(x) = 6x+2."],
["Funções elementares","(eˣ)′ = eˣ; (ln x)′ = 1/x; (sen x)′ = cos x; (cos x)′ = −sen x; (tan x)′ = sec²x; (arctan x)′ = 1/(1+x²); (arcsen x)′ = 1/√(1−x²). Ex.: f(x) = x³−4x²+6 resulta em f′(x) = 3x²−8x."],
["Funções compostas","Regra da cadeia: [f(g(x))]′ = f′(g(x))·g′(x). Ex.: f(x) = (2x+3)²: externa u², interna 2x+3, então f′ = 2(2x+3)·2 = 8x+12. Ex.: [sen(3x)]′ = 3cos(3x)."],
["Regras avançadas","<b>Produto</b>: (fg)′ = f′g + fg′. Ex.: (x²+1)(3x−2) resulta em 2x(3x−2) + 3(x²+1) = 9x²−4x+3. <b>Quociente</b>: (f/g)′ = (f′g − fg′)/g². <b>Implícita</b>: derive os dois lados; em x²+y² = 25, 2x+2y·y′ = 0, então y′ = −x/y. <b>Ordem superior</b>: f(x) = x³, f′ = 3x², f″ = 6x."],
["Erros comuns","<b>(x²)′ = x</b> (errado): o correto é 2x, pois o expoente multiplica e reduz 1. <b>(fg)′ = f′g′</b> (errado): use a regra do produto. <b>(sen 3x)′ = cos 3x</b> (errado): falta a cadeia, o correto é 3cos 3x. <b>(eˣ)′ = x·eˣ⁻¹</b> (errado): aqui o x está no expoente, então (eˣ)′ = eˣ. <b>(5)′ = 5</b> (errado): a derivada de constante é 0."]],
integrais:[["O que é integral?","A integral é a área (com sinal) entre a curva e o eixo x, e também o processo inverso da derivada. Ex.: ∫₀² x dx é a área de um triângulo de base 2 e altura 2, que vale 2. Veja a área animada na calculadora."],
["Integral indefinida","∫f(x)dx = F(x) + C, onde F′ = f (F é a antiderivada). C é a constante de integração: F+1 e F+5 têm a mesma derivada. Ex.: ∫2x dx = x² + C, pois (x²+C)′ = 2x."],
["Integral imediata","∫xⁿdx = xⁿ⁺¹/(n+1) + C (n ≠ −1); ∫1/x dx = ln|x| + C; ∫eˣdx = eˣ + C; ∫sen x dx = −cos x + C; ∫cos x dx = sen x + C. Ex.: ∫x² dx = x³/3 + C."],
["Regras básicas","∫c dx = cx + C; ∫(f±g)dx = ∫f dx ± ∫g dx; ∫c·f dx = c∫f dx. Ex.: ∫(2x+5)dx = x²+5x+C; ∫3x³dx = 3x⁴/4 + C."],
["Regras de integração","Polinômios: integre termo a termo. ∫aˣdx = aˣ/ln a + C. ∫sec²x dx = tan x + C. ∫ln x dx = x·ln x − x + C (por partes). Ex.: ∫(x²+3x)dx = x³/3 + 3x²/2 + C."],
["Substituição","Use quando houver uma função e a derivada da parte interna: u = g(x), du = g′(x)dx. Ex.: ∫2x(x²+1)³dx: u = x²+1 e du = 2x dx, então ∫u³du = u⁴/4 + C = (x²+1)⁴/4 + C."],

["Integral definida","<b>∫ₐᵇ f(x)dx = F(b) − F(a)</b> (Teorema Fundamental do Cálculo), onde a e b são os limites de integração. Diferente da indefinida, o resultado é um número. Ex.: ∫₀² x²dx = [x³/3]₀² = 8/3 ≈ 2,667."],
